<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Autopeli" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Autopeli</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1d2b3a;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Every element, overlays included: no browser touch gestures anywhere (Safari's double-tap zoom
         applies per element, so the HUD and the Night overlay need it too). */
      *, *::before, *::after {
        touch-action: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #1d2b3a;
        color: #fff;
        font: 24px system-ui, sans-serif;
        z-index: 10;
      }
      @media (orientation: portrait) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your device to landscape</div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
